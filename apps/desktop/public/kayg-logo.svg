<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1024 1024"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">KayG logo</title>
  <desc id="description">
    A coral K and G monogram with a marigold conversation dot, inspired by the Marathi phrase काय गं.
  </desc>

  <g
    fill="none"
    stroke="#ff665a"
    stroke-width="90"
    stroke-linecap="round"
    stroke-linejoin="round"
    shape-rendering="geometricPrecision"
  >
    <!-- The top bar quietly echoes the Devanagari headline. -->
    <path d="M165 850V220Q165 155 230 155H855" />

    <!-- K arms: the lower arm flows into the conversational G. -->
    <path d="M210 520L405 350" />
    <path d="M210 520C350 655 465 770 635 800" />

    <!-- Open G with a friendly, question-like lower terminal. -->
    <path d="M845 400C770 320 635 310 530 385C420 465 405 620 495 715C580 805 720 815 815 725C840 700 855 675 862 645" />
    <path d="M862 645C895 725 885 805 820 845C775 873 720 880 650 880H590" />
  </g>

  <circle cx="650" cy="560" r="46" fill="#f5b83b" />
</svg>
