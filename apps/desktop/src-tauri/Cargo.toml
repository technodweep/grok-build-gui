[package]
name = "kayg"
version = "0.1.0"
description = "Independent desktop client compatible with the Grok Build CLI over ACP"
authors = ["technodweep"]
edition = "2021"

[lib]
name = "kayg_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
thiserror = "2"
dirs = "6"
which = "8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"
toml = { version = "0.8", features = ["parse", "display"] }
toml_edit = "0.22"
base64 = "0.22"
