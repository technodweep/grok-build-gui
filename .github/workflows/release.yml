name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux:
    name: Build Linux packages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            patchelf libayatana-appindicator3-dev build-essential \
            libssl-dev libxdo-dev pkg-config \
            rpm \
            file

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install frontend deps
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Tauri build (Linux bundles)
        working-directory: apps/desktop
        # Prefer Linux targets explicitly so "all" does not try foreign formats.
        run: pnpm tauri build --bundles deb,appimage,rpm

      - name: Collect artifacts
        run: |
          mkdir -p dist-packages
          find target/release/bundle -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*.rpm' \) -print -exec cp -v {} dist-packages/ \;
          ls -la dist-packages/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: dist-packages/*

  macos:
    name: Build macOS packages
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install frontend deps
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Import Apple certificate (optional)
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            echo "No APPLE_CERTIFICATE secret — building unsigned."
            exit 0
          fi
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o "$CERTIFICATE_PATH"
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN_PATH"

      - name: Tauri build (app + dmg)
        working-directory: apps/desktop
        run: pnpm tauri build --bundles app,dmg
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          TAURI_SIGNING_PRIVATE_KEY: ""

      - name: Notarize dmg (optional)
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          if [ -z "${APPLE_ID:-}" ] || [ -z "${APPLE_APP_SPECIFIC_PASSWORD:-}" ]; then
            echo "Skipping notarization (secrets not set)."
            exit 0
          fi
          shopt -s nullglob
          for dmg in target/release/bundle/dmg/*.dmg; do
            echo "Notarizing $dmg"
            xcrun notarytool submit "$dmg" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --wait
            xcrun stapler staple "$dmg" || true
          done

      - name: Collect artifacts
        run: |
          mkdir -p dist-packages
          find target/release/bundle -type f \( -name '*.dmg' -o -name '*.app' \) -print 2>/dev/null || true
          # .app is a directory — zip it for release upload.
          if [ -d target/release/bundle/macos ]; then
            for app in target/release/bundle/macos/*.app; do
              [ -d "$app" ] || continue
              base=$(basename "$app" .app)
              ditto -c -k --sequesterRsrc --keepParent "$app" "dist-packages/${base}-macos.app.zip"
            done
          fi
          find target/release/bundle -type f -name '*.dmg' -exec cp -v {} dist-packages/ \;
          ls -la dist-packages/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: dist-packages/*

  windows:
    name: Build Windows packages
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install frontend deps
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Tauri build (nsis + msi)
        working-directory: apps/desktop
        run: pnpm tauri build --bundles nsis,msi

      - name: Sign Windows artifacts (optional)
        shell: bash
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "${WINDOWS_CERTIFICATE:-}" ]; then
            echo "No WINDOWS_CERTIFICATE secret — leaving unsigned."
            exit 0
          fi
          CERT="$RUNNER_TEMP/cert.pfx"
          echo -n "$WINDOWS_CERTIFICATE" | base64 --decode > "$CERT"
          # Prefer signtool if available (VS / Windows SDK).
          SIGNTOOL=$(find "/c/Program Files (x86)/Windows Kits" -name signtool.exe 2>/dev/null | head -1 || true)
          if [ -z "$SIGNTOOL" ]; then
            echo "signtool.exe not found; skip signing."
            exit 0
          fi
          for f in $(find target/release/bundle -type f \( -name '*.exe' -o -name '*.msi' \)); do
            echo "Signing $f"
            "$SIGNTOOL" sign -f "$CERT" -p "$WINDOWS_CERTIFICATE_PASSWORD" \
              -fd SHA256 -tr http://timestamp.digicert.com -td SHA256 "$f" || true
          done

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist-packages
          find target/release/bundle -type f \( -name '*.exe' -o -name '*.msi' \) -print -exec cp -v {} dist-packages/ \;
          ls -la dist-packages/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: dist-packages/*

  release:
    name: Publish GitHub Release
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-packages
          merge-multiple: true

      - name: List packages
        run: find dist-packages -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-packages/**
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
