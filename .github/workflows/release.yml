name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux:
    name: Build Linux packages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            patchelf libayatana-appindicator3-dev build-essential \
            libssl-dev libxdo-dev pkg-config \
            rpm \
            file

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install frontend deps
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Tauri build (Linux bundles)
        working-directory: apps/desktop
        # Prefer Linux targets explicitly so "all" does not try foreign formats.
        run: pnpm tauri build --bundles deb,appimage,rpm

      - name: Collect artifacts
        run: |
          mkdir -p dist-packages
          find target/release/bundle -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*.rpm' \) -print -exec cp -v {} dist-packages/ \;
          ls -la dist-packages/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: dist-packages/*

  macos:
    name: Build macOS packages
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install frontend deps
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Tauri build (app + dmg)
        working-directory: apps/desktop
        # Unsigned CI builds are fine for GitHub Releases; notarize later with secrets.
        run: pnpm tauri build --bundles app,dmg
        env:
          # Avoid failing when no Apple signing identity is present.
          TAURI_SIGNING_PRIVATE_KEY: ""

      - name: Collect artifacts
        run: |
          mkdir -p dist-packages
          find target/release/bundle -type f \( -name '*.dmg' -o -name '*.app' \) -print 2>/dev/null || true
          # .app is a directory — zip it for release upload.
          if [ -d target/release/bundle/macos ]; then
            for app in target/release/bundle/macos/*.app; do
              [ -d "$app" ] || continue
              base=$(basename "$app" .app)
              ditto -c -k --sequesterRsrc --keepParent "$app" "dist-packages/${base}-macos.app.zip"
            done
          fi
          find target/release/bundle -type f -name '*.dmg' -exec cp -v {} dist-packages/ \;
          ls -la dist-packages/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: dist-packages/*

  windows:
    name: Build Windows packages
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install frontend deps
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Tauri build (nsis + msi)
        working-directory: apps/desktop
        run: pnpm tauri build --bundles nsis,msi

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist-packages
          find target/release/bundle -type f \( -name '*.exe' -o -name '*.msi' \) -print -exec cp -v {} dist-packages/ \;
          ls -la dist-packages/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: dist-packages/*

  release:
    name: Publish GitHub Release
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-packages
          merge-multiple: true

      - name: List packages
        run: find dist-packages -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-packages/**
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
